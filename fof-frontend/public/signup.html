<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Join | DOTTIE.YZ</title>
    <link rel="stylesheet" href="/src/css/style.css">
    <style>[x-cloak] { display: none !important; }</style>
</head>
<body class="bg-d-surface text-d-text-primary antialiased overflow-x-hidden min-h-screen flex items-center justify-center p-6" data-api-base-url="https://dottie-backend.onrender.com" 
      x-data="authLogic()">

    <div class="w-full max-w-md">
        <div class="text-center mb-10">
            <a href="/index.html" class="text-4xl font-display font-bold tracking-tighter">DOTTIE<span class="text-d-accent">.</span>YZ</a>
            <p class="text-d-text-muted text-xs uppercase tracking-[0.3em] mt-2">Premium Streetwear</p>
        </div>

        <div class="bg-d-surface-2 border border-d-border p-8 sm:p-10 relative overflow-hidden w-full">
            <div class="absolute -top-24 -left-24 w-48 h-48 bg-d-accent/5 rounded-full blur-3xl pointer-events-none"></div>

            <h1 class="text-2xl font-display font-bold uppercase tracking-tight mb-8">Join the Community</h1>

            <form @submit.prevent="signup()" class="space-y-6">
                <div class="space-y-2">
                    <label class="block text-[10px] uppercase tracking-widest text-d-text-muted font-bold">Full Name</label>
                    <input type="text" x-model="name" required
                           class="w-full bg-d-surface border-b border-d-border p-4 text-sm focus:border-d-accent outline-none transition-all placeholder:text-d-text-muted"
                           placeholder="John Doe">
                </div>

                <div class="space-y-2">
                    <label class="block text-[10px] uppercase tracking-widest text-d-text-muted font-bold">Email Address</label>
                    <input type="email" x-model="email" required
                           class="w-full bg-d-surface border-b border-d-border p-4 text-sm focus:border-d-accent outline-none transition-all placeholder:text-d-text-muted"
                           placeholder="name@example.com">
                </div>

                <div class="space-y-2">
                    <label class="block text-[10px] uppercase tracking-widest text-d-text-muted font-bold">Password</label>
                    <input type="password" x-model="password" required
                           class="w-full bg-d-surface border-b border-d-border p-4 text-sm focus:border-d-accent outline-none transition-all placeholder:text-d-text-muted"
                           placeholder="••••••••">
                </div>

                <div class="text-xs text-d-text-muted font-light leading-relaxed">
                    By signing up, you agree to receive updates about new drops. You can unsubscribe at any time.
                </div>

                <button type="submit" 
                        class="w-full btn-primary"
                        :disabled="loading">
                    <span x-show="!loading">Join Now</span>
                    <span x-show="loading" x-cloak>Enlisting...</span>
                </button>
            </form>

            <p class="text-center text-[10px] uppercase tracking-widest text-d-text-muted mt-10 font-bold">
                Already a member? <a href="/login.html" class="text-d-accent hover:text-d-accent-light transition-colors">Sign In</a>
            </p>
        </div>
    </div>

    <!-- Toast Notification -->
    <div x-data="{ show: false, message: '', type: 'success' }" 
         @notify.window="show = true; message = $event.detail.message; type = $event.detail.type || 'success'; setTimeout(() => show = false, 3000)"
         x-show="show"
         x-transition:enter="transition ease-out duration-300"
         x-transition:enter-start="opacity-0 translate-y-1.5"
         x-transition:enter-end="opacity-100 translate-y-0"
         x-transition:leave="transition ease-in duration-100"
         x-transition:leave-start="opacity-100 translate-y-0"
         x-transition:leave-end="opacity-0 translate-y-1.5"
         class="fixed bottom-4 right-4 z-50 px-6 py-3 bg-d-surface-2 border border-d-border flex items-center space-x-3"
         :class="type === 'success' ? 'text-d-accent border-d-accent/20' : 'text-red-400 border-red-900/50'">
         <span x-text="message"></span>
    </div>

    <script type="module" src="/src/js/entry/signup-entry.js"></script>
</body>
</html>
