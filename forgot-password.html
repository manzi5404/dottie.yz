<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset Password | DOTTIE.YZ</title>
    <link rel="stylesheet" href="/src/css/style.css">
    <style>[x-cloak] { display: none !important; }</style>
</head>
<body class="bg-d-surface text-d-text-primary antialiased overflow-x-hidden min-h-screen flex items-center justify-center p-6" data-api-base-url="https://faith-over-fear-mqgz.onrender.com" 
      x-data="forgotLogic()">

    <div class="w-full max-w-md">
        <div class="text-center mb-10">
            <a href="/index.html" class="text-4xl font-display font-bold tracking-tighter">DOTTIE<span class="text-d-accent">.</span>YZ</a>
            <p class="text-d-text-muted text-xs uppercase tracking-[0.3em] mt-2">Premium Streetwear</p>
        </div>

        <div class="bg-d-surface-2 border border-d-border p-8 sm:p-10 relative overflow-hidden" x-show="!submitted">
            <div class="absolute -top-24 -right-24 w-48 h-48 bg-d-accent/5 rounded-full blur-3xl pointer-events-none"></div>

            <h1 class="text-2xl font-display font-bold uppercase tracking-tight mb-4">Reset Password</h1>
            <p class="text-d-text-secondary text-sm mb-8">Enter your email address and we'll send you a link to reset your password.</p>

            <form @submit.prevent="sendResetLink()" class="space-y-6">
                <div class="space-y-2">
                    <label class="block text-[10px] uppercase tracking-widest text-d-text-muted font-bold">Email Address</label>
                    <input type="email" x-model="email" required
                           class="w-full bg-d-surface border-b border-d-border p-4 text-sm focus:border-d-accent outline-none transition-all placeholder:text-d-text-muted"
                           placeholder="name@example.com">
                </div>

                <button type="submit" 
                        class="w-full btn-primary"
                        :disabled="loading">
                    <span x-show="!loading">Send Reset Link</span>
                    <span x-show="loading" x-cloak>Sending...</span>
                </button>
            </form>

            <p class="text-center text-[10px] uppercase tracking-widest text-d-text-muted mt-10 font-bold">
                Remember your password? <a href="/login.html" class="text-d-accent hover:text-d-accent-light transition-colors">Sign In</a>
            </p>
        </div>

        <!-- Success State -->
        <div class="bg-d-surface-2 border border-d-border p-8 sm:p-10 text-center" x-show="submitted" x-cloak>
            <div class="w-16 h-16 bg-d-accent/20 text-d-accent flex items-center justify-center mx-auto mb-6">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
            </div>
            <h1 class="text-2xl font-display font-bold uppercase tracking-tight mb-4">Check Your Email</h1>
            <p class="text-d-text-secondary text-sm mb-8">We've sent a password reset link to <span class="text-white font-medium" x-text="email"></span>.</p>
            <a href="/login.html" class="block w-full btn-primary text-center">Back to Sign In</a>
        </div>
    </div>

    <!-- Toast Notification -->
    <div x-data="{ show: false, message: '', type: 'success' }" 
         @notify.window="show = true; message = $event.detail.message; type = $event.detail.type || 'success'; setTimeout(() => show = false, 3000)"
         x-show="show"
         x-transition:enter="transition ease-out duration-300"
         x-transition:enter-start="opacity-0 translate-y-1.5"
         x-transition:enter-end="opacity-100 translate-y-0"
         x-transition:leave="transition ease-in duration-100"
         x-transition:leave-start="opacity-100 translate-y-0"
         x-transition:leave-end="opacity-0 translate-y-1.5"
         class="fixed bottom-4 right-4 z-50 px-6 py-3 bg-d-surface-2 border border-d-border flex items-center space-x-3"
         :class="type === 'success' ? 'text-d-accent border-d-accent/20' : 'text-red-400 border-red-900/50'">
         <span x-text="message"></span>
    </div>

    <script type="module">
        import Alpine from 'alpinejs';
        
        window.forgotLogic = () => ({
            email: '',
            loading: false,
            submitted: false,

            async sendResetLink() {
                this.loading = true;
                try {
                    const response = await fetch('/api/auth/forgot-password', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ email: this.email })
                    });
                    
                    const data = await response.json();
                    if (!response.ok) throw new Error(data.message || 'Failed to send reset link');

                    this.submitted = true;
                } catch (error) {
                    window.dispatchEvent(new CustomEvent('notify', { detail: { message: error.message, type: 'error' } }));
                } finally {
                    this.loading = false;
                }
            }
        });

        window.Alpine = Alpine;
        Alpine.start();
    </script>
</body>
</html>
